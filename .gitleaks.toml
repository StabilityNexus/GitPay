# Default gitleaks rules, plus an allowlist of exact values that are public by
# design. It lists values, never paths, so a real key committed next to these
# in a test is still caught.
#
# `[allowlist]` (singular) on purpose. gitleaks-action installs gitleaks 8.24.x,
# which silently ignores the `[[allowlists]]` array form (added in 8.25) — that
# is why the daily full-history scan failed on these same values. The singular
# table works on 8.24 and is still accepted by later versions.

[extend]
useDefault = true

[allowlist]
description = "Known-public test values used by golden vectors and driver tests"
regexTarget = "secret"
regexes = [
  # Anvil / Hardhat test account #0. Published in the Foundry and Hardhat docs
  # and never funded on a real network. Also listed in REFERENCES.md.
  '''^(0x)?ac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80$''',
  # Circle's USDC token contract on Ethereum Sepolia. A contract address, not a
  # secret; flagged only because the field holding it is named `token`.
  '''(?i)^(0x)?1c7d4b196cb0c7b01d743fbc6116a902379c7238$''',
  # Circle's USDC token contract on Ethereum mainnet, per Circle's published
  # contract list. Same reason as above: public, flagged for its field name.
  '''(?i)^(0x)?a0b86991c6218b36c1d19d4a2e9eb0ce3606eb48$''',
]
