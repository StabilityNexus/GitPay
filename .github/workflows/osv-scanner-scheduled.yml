# https://google.github.io/osv-scanner/github-action/#scheduled-scans
name: OSV-Scanner Scheduled Scan

on:
  schedule:
    - cron: "30 12 * * 1"
  # Change "main" to your default branch if you use a different name, i.e. "master"
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  scan-scheduled:
    permissions:
      actions: read # see github/codeql-action#2117
      security-events: write # upload SARIF to the security tab
      contents: read
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
