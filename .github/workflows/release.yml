name: Release

# Publishes a GitPay release when a maintainer pushes a version tag:
#
#   git tag -a v1.0.0 -m "v1.0.0" && git push origin v1.0.0
#
# The tag must match VERSION. The release carries the Action bundle, a
# CycloneDX SBOM of its runtime dependencies, and checksums. The bundle gets a
# signed build-provenance attestation and an SBOM attestation, so an adopter
# can check that the dist/index.js they run was built by this workflow from
# this tag:
#
#   gh attestation verify dist/index.js --repo StabilityNexus/GitPay
#
# A stable release also moves the major tag (v1), which is what adopters pin.

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build, attest and publish
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release and move the major tag
      id-token: write # sign the attestations with this workflow's identity
      attestations: write # store them
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm

      - name: The tag matches VERSION
        run: |
          want="v$(tr -d '[:space:]' < VERSION)"
          if [ "$TAG" != "$want" ]; then
            echo "::error::Tag $TAG does not match VERSION ($want). Bump VERSION first."
            exit 1
          fi

      - run: npm ci

      - name: Ground rules (lint, I1 boundary, I11 dependency count, tests)
        run: npm run check

      - name: I12 — dist/ is reproducible from src/
        run: |
          npm run build
          if ! git diff --exit-code -- dist; then
            echo "::error::dist/ at $TAG does not match a rebuild from src/. Refusing to release it."
            exit 1
          fi

      - name: SBOM of what ships (runtime dependencies only)
        run: npm sbom --omit dev --sbom-format cyclonedx > gitpay.cdx.json

      - name: Checksums
        run: sha256sum dist/index.js gitpay.cdx.json > SHA256SUMS

      - name: Build provenance for the Action bundle
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/index.js

      - name: SBOM attestation for the Action bundle
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: dist/index.js
          sbom-path: gitpay.cdx.json

      - name: Publish the release
        run: |
          prerelease=""
          case "$TAG" in *-*) prerelease="--prerelease" ;; esac
          # release-drafter may already hold a draft for this tag. Fill it
          # rather than creating a second release beside it.
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/index.js gitpay.cdx.json SHA256SUMS --clobber -R "$GITHUB_REPOSITORY"
            gh release edit "$TAG" --draft=false $prerelease -R "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" dist/index.js gitpay.cdx.json SHA256SUMS \
              --verify-tag --generate-notes --title "$TAG" $prerelease -R "$GITHUB_REPOSITORY"
          fi

      - name: Move the major tag
        # Adopters pin `StabilityNexus/GitPay@v1`. A pre-release never moves it.
        if: ${{ !contains(github.ref_name, '-') }}
        run: |
          major="${TAG%%.*}"
          sha="$(git rev-parse HEAD)"
          ref="repos/$GITHUB_REPOSITORY/git/refs/tags/$major"
          if gh api "$ref" >/dev/null 2>&1; then
            gh api -X PATCH "$ref" -f sha="$sha" -F force=true >/dev/null
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$major" -f sha="$sha" >/dev/null
          fi
          echo "$major -> $sha"
