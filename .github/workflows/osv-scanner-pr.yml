# https://google.github.io/osv-scanner/github-action/#scan-on-pull-request
name: OSV-Scanner PR Scan

# Change "main" to your default branch if you use a different name, i.e. "master"
on:
  pull_request:
    branches: [main]
  merge_group:
    branches: [main]

permissions:
  contents: read

jobs:
  scan-pr:
    permissions:
      actions: read # see github/codeql-action#2117
      security-events: write # upload SARIF to the security tab
      contents: read
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
